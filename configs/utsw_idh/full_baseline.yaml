base_config: "server_base.yaml"

output_dir: outputs/utsw_idh/full_baseline_seed42

data:
  split_json: splits/utsw_idh/utsw_idh_debug_split.json
  allow_subset_split: false

train:
  mode: full_modality_train
  fixed_combo: [t2, t1ce, t1, flair]
  epochs: 100
  batch_size: 1
  early_stop_patience: 15

calibration:
  enable_threshold_calibration: true
  threshold_mode: global
  default_threshold: 0.5

eval:
  test_all_combos: false
